name: Test offline video export
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and prepare native tests
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx cap add android
          npx cap sync android
          python3 scripts/install_native.py
          mkdir -p android/app/src/androidTest/assets
          ffmpeg -y -f lavfi -i color=c=black:s=320x240:r=12:d=2 -f lavfi -i sine=frequency=440:duration=2 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android/app/src/androidTest/assets/audio.mp4
          ffmpeg -y -i android/app/src/androidTest/assets/audio.mp4 -an -c:v copy android/app/src/androidTest/assets/silent.mp4
          ffmpeg -y -i android/app/src/androidTest/assets/audio.mp4 -c copy -metadata:s:v:0 rotate=90 android/app/src/androidTest/assets/portrait.mp4
          chmod +x android/gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export MP4s in emulator with networking disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Publish APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendario-offline-export-tests-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/debug/app-debug.apk
