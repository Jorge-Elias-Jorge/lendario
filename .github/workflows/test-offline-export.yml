name: Test offline video export
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  android-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and prepare native tests
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx cap add android
          npx cap sync android
          python3 scripts/install_native.py
          python3 scripts/prepare_offline_test.py
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export MP4s without INTERNET permission
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          script: |
            sleep 10
            cd android && ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1024m connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.legendario.editor.OfflineExportTest --stacktrace
      - name: Publish APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legendario-offline-export-tests-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/apk/debug/app-debug.apk
