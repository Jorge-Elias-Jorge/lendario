name: Build APK LEGENDÁRIO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools
      - name: Instalar dependências
        run: |
          npm install
          npm install --save @capacitor/core@^6
          npm install --save-dev @capacitor/cli@^6 @capacitor/android@^6
      - name: Compilar recursos locais
        run: |
          if grep -q '"build"' package.json; then npm run build; else npx vite build; fi
      - name: Gerar ou reutilizar projeto Android
        run: |
          if [ ! -f android/variables.gradle ]; then npx cap add android; fi
          npx cap sync android
      - name: Instalar módulos nativos LEGENDÁRIO
        run: python3 scripts/install_native.py
      - name: Compilar APK debug instalável
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Verificar e preparar APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/legendario-debug.apk
          sha256sum artifacts/legendario-debug.apk > artifacts/SHA256SUMS.txt
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: legendario-apk-debug
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
