name: Build LEGENDÁRIO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Zip build
        run: cd dist && zip -r ../legendario-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: legendario-web
          path: legendario-web.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android || true
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug || echo "Android build requer configuração nativa adicional"
      - uses: actions/upload-artifact@v4
        with:
          name: legendario-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore