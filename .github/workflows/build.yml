name: Build LEGENDÁRIO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Zip build
        run: cd dist && zip -r ../legendario-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: legendario-web
          path: legendario-web.zip

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npm run build
      - name: Adicionar Capacitor Android (se configurado)
        run: |
          if [ -f capacitor.config.ts ] || [ -f capacitor.config.json ]; then
            npx cap add android || true
            npx cap sync android || true
          else
            echo "Capacitor não configurado — a compilar apenas a versão web"
          fi
      - name: Compilar APK (se existir projeto Android)
        run: |
          if [ -d android ]; then
            cd android
            chmod +x gradlew || true
            ./gradlew assembleDebug || echo "Android build requer configuração nativa adicional"
          else
            echo "Sem projeto Android — a ignorar"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: legendario-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore